name = "sabboura"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Static assets are served free and unmetered; only /api/* reaches the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

[vars]
# The Firebase project whose ID tokens this Worker will accept. Public by design —
# it only says which issuer is trusted, and every token is still verified against
# Google's published keys.
FIREBASE_PROJECT_ID = "r4m-whiteboard"

[[d1_databases]]
binding = "DB"
database_name = "sabboura"
# Local dev emulates D1 and ignores this id.
database_id = "c8af5b61-10c3-4ef5-9348-03a6d5b856a4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "sabboura-files"

# One room per board: the live document, its sockets, and its history.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "BoardRoom"

# SQLite-backed, which is what the free plan offers and what the history log needs.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardRoom"]
