name = "sabboura"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Static assets are served free and unmetered; only /api/* reaches the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

# Bindings added in later phases:
#   Phase 5  [[d1_databases]]     folders, boards, sharing
#   Phase 6  [[r2_buckets]]       images
#   Phase 7  [[durable_objects]]  one BoardRoom per board
