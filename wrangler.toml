name = "sabboura"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Served at the custom domain (Phase 18); the workers.dev address keeps working too.
# Google sign-in needs both in Firebase's authorised domains.
workers_dev = true
routes = [{ pattern = "sabboura.read4more.com", custom_domain = true }]

# Static assets are served free and unmetered; only /api/* reaches the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Pages (not the built files under /assets) reach the Worker first, so a visit to the
# old workers.dev address can be sent on to the custom domain. Files stay free.
run_worker_first = ["/*", "!/assets/*", "!/favicon.svg"]

# Rate limits (Phase 18), per caller address per minute; see worker/limits.ts.
# Everything else under /api/, room connections included.
[[ratelimits]]
name = "LIMIT_API"
namespace_id = "18001"
simple = { limit = 1200, period = 60 }

# Link previews, new boards and duplicates, transfers, inviting people.
[[ratelimits]]
name = "LIMIT_HEAVY"
namespace_id = "18002"
simple = { limit = 60, period = 60 }

# Error reports from browsers.
[[ratelimits]]
name = "LIMIT_ERRORS"
namespace_id = "18003"
simple = { limit = 30, period = 60 }

[observability]
enabled = true

[vars]
# The Firebase project whose ID tokens this Worker will accept. Public by design —
# it only says which issuer is trusted, and every token is still verified against
# Google's published keys.
FIREBASE_PROJECT_ID = "r4m-whiteboard"
# Pages opened at a *.workers.dev address are sent here, path and link intact.
CANONICAL_HOST = "sabboura.read4more.com"

[[d1_databases]]
binding = "DB"
database_name = "sabboura"
# Local dev emulates D1 and ignores this id.
database_id = "c8af5b61-10c3-4ef5-9348-03a6d5b856a4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "sabboura-files"

# One room per board: the live document, its sockets, and its history.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "BoardRoom"

# SQLite-backed, which is what the free plan offers and what the history log needs.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardRoom"]
