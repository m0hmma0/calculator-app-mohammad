name = "sabboura"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Static assets are served free and unmetered; only /api/* reaches the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

[vars]
# The Firebase project whose ID tokens this Worker will accept. Public by design —
# it only says which issuer is trusted, and every token is still verified against
# Google's published keys.
FIREBASE_PROJECT_ID = ""

[[d1_databases]]
binding = "DB"
database_name = "sabboura"
# Replaced with the real id at deploy time; local dev emulates D1 and ignores it.
database_id = "local-dev"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "sabboura-files"

# Phase 7 adds:
#   [[durable_objects.bindings]]  one BoardRoom per board
